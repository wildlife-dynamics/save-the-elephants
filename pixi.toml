[workspace]
name = "save-the-elephants"
channels = [
    # Uncomment the following lines to use local channels for development.
    # "file:///tmp/ecoscope-workflows/release/artifacts/",
    "file:///tmp/ecoscope-workflows-custom/release/artifacts/",
    'https://repo.prefix.dev/ecoscope-workflows/',
    'conda-forge',
    'https://repo.prefix.dev/ecoscope-workflows-custom/',
]
platforms = ['linux-64', 'osx-arm64', 'win-64']

[dependencies]
curl = "*"
rattler-build = "*"
yq = "*"
hatch = "*"
pip = "*"
hatch-vcs = "*"
playwright = ">=1.58.2,<2"
wt-compiler = "==0.8.0"
graphviz = "*"

[feature.compile.dependencies]
# Include this if you add new tasks and the package has been built

ecoscope-workflows-ext-ste = "*"
ecoscope-workflows-ext-custom = "0.1.0rc14.*"
graphviz = "*"
wt-compiler = "==0.8.0"

[environments]
compile = { features = [
    "compile",
], solve-group = "compile", no-default-feature = true }

[tasks]
[tasks.build-release]
cmd = './publish/build.sh'

[tasks.pytest-310]
cmd = './dev/pytest-task.sh 310'

[tasks.pytest-311]
cmd = './dev/pytest-task.sh 311'

[tasks.pytest-312]
cmd = './dev/pytest-task.sh 312'

[feature.compile.tasks.compile-aerial_survey_lines]
cmd = './dev/recompile.sh aerial_survey_lines --install'
depends-on = ["build-release"]

[feature.compile.tasks.recompile-aerial_survey_lines]
cmd = './dev/recompile.sh aerial_survey_lines --no-install'
depends-on = ["build-release"]

[feature.compile.tasks.compile-mapbook_report]
cmd = './dev/recompile.sh mapbook_report --install'
depends-on = ["build-release"]

[feature.compile.tasks.recompile-mapbook_report]
cmd = './dev/recompile.sh mapbook_report --no-install'
depends-on = ["build-release"]

[feature.compile.tasks.compile-general_report]
cmd = './dev/recompile.sh general_report --install'
depends-on = ["build-release"]

[feature.compile.tasks.recompile-general_report]
cmd = './dev/recompile.sh general_report --no-install'
depends-on = ["build-release"]

[feature.compile.tasks.compile-aerial_images]
cmd = './dev/recompile.sh aerial_images --install'
depends-on = ["build-release"]

[feature.compile.tasks.recompile-aerial_images]
cmd = './dev/recompile.sh aerial_images --no-install'
depends-on = ["build-release"]
