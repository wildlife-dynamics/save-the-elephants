id: mapbook_report 
requirements:
  - name: ecoscope-platform
    version: ">=2.15.0, <2.16.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "*"
    channel: "file:///tmp/ecoscope-workflows-custom/release/artifacts/"

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

rjsf-overrides:
  properties:
    # Subject Group
    Subject Group.properties.subject_group_var.properties.var.title: Subject Group Name
    Subject Group.properties.subject_group_var.properties.var.default: Elephants
    Subject Group.properties.subject_group_var.properties.var.description: "Enter the subject group name exactly as it appears in EarthRanger (case-sensitive)."

    # Trajectory Segment Filter — cleaner titles and descriptions
    Trajectory Segment Filter.properties.custom_trajs_filter.properties.min_length_meters.title: "Minimum Segment Length (m)"
    Trajectory Segment Filter.properties.custom_trajs_filter.properties.min_length_meters.description: "Discard segments shorter than this distance. Helps remove GPS noise and stationary fixes."
    Trajectory Segment Filter.properties.custom_trajs_filter.properties.max_length_meters.title: "Maximum Segment Length (m)"
    Trajectory Segment Filter.properties.custom_trajs_filter.properties.max_length_meters.description: "Discard segments longer than this distance. Helps remove unrealistic long-distance jumps."
    Trajectory Segment Filter.properties.custom_trajs_filter.properties.min_time_secs.title: "Minimum Segment Duration (s)"
    Trajectory Segment Filter.properties.custom_trajs_filter.properties.min_time_secs.description: "Discard segments with a duration shorter than this (in seconds)."
    Trajectory Segment Filter.properties.custom_trajs_filter.properties.max_time_secs.title: "Maximum Segment Duration (s)"
    Trajectory Segment Filter.properties.custom_trajs_filter.properties.max_time_secs.description: "Discard segments with a duration longer than this (in seconds). Default is 6 hours (21,600 s)."
    Trajectory Segment Filter.properties.custom_trajs_filter.properties.min_speed_kmhr.title: "Minimum Speed (km/h)"
    Trajectory Segment Filter.properties.custom_trajs_filter.properties.min_speed_kmhr.description: "Discard segments where average speed falls below this value."
    Trajectory Segment Filter.properties.custom_trajs_filter.properties.max_speed_kmhr.title: "Maximum Speed (km/h)"
    Trajectory Segment Filter.properties.custom_trajs_filter.properties.max_speed_kmhr.description: "Discard segments where average speed exceeds this value. For elephants, 9 km/h is a sensible ceiling."

    # Report Logo
    Report Logo.properties.logo_path.properties.input_method.description: "Provide the organization logo to display on the report cover page (PNG or JPG recommended)."

    # Previous Period — clarify that the comparison period ends where the current time range begins
    Previous Period.properties.set_previous_period.properties.offset.description: "Choose how to calculate the comparison period's Start Date. In every mode, the comparison period ends on your selected time range's Start Date (so it never overlaps with the current period) — only the Start Date changes."

    # Mean Speed Raster — clarify what Step Length controls, and label the anyOf branches meaningfully
    Mean Speed Raster.properties.generate_mean_speed_raster.properties.step_length.title: "Step Length (m)"
    Mean Speed Raster.properties.generate_mean_speed_raster.properties.step_length.description: "Sets the pixel (cell) size of the mean speed raster, in meters. Smaller values produce a more detailed raster but take longer to generate and produce larger files; larger values produce a coarser raster. Enter a fixed value (default 2000 m), or choose \"Auto\" to let the system use the average distance between consecutive GPS fixes instead."
    Mean Speed Raster.properties.generate_mean_speed_raster.properties.step_length.anyOf:
      - type: integer
        title: "Fixed value (m)"
      - type: "null"
        title: "Auto (use average step distance)"

  $defs:
    # Restrict category options to Subject Name, Subject Sex and Subject Subtype
    ValueGrouper.properties.index_name.oneOf:
      - const: subject_name
        title: Subject Name

      - const: subject_sex
        title: Subject Sex

      - const: subject_subtype
        title: Subject Subtype

    # Previous Period — Custom: drop Hours/Minutes/Seconds (too fine-grained for this report) and default Months to 1
    CustomPreviousPeriod.description: "Manually set how far back the comparison period's Start Date should be, counted backward from your time range's start date. For example, the default (Months = 1) creates a comparison period covering the month immediately before your report's start date."
    CustomPreviousPeriod.properties:
      years:
        title: Years
        type: integer
        default: 0
        description: "Whole years to go back from your time range's start date."
      months:
        title: Months
        type: integer
        default: 1
        description: "Whole months to go back from your time range's start date."
      weeks:
        title: Weeks
        type: integer
        default: 0
        description: "Whole weeks to go back from your time range's start date."
      days:
        title: Days
        type: integer
        default: 0
        description: "Whole days to go back from your time range's start date."

    # Previous Period — Preset
    PresetPreviousPeriod.properties.preset.description: "Choose a common lookback period, counted backward from your time range's start date. \"Same as current period\" reuses your currently selected Start and End dates unchanged."

    # Previous Period — Calendar
    CalendarPreviousPeriod.properties.since.description: "Pick the exact Start Date for the comparison period."

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow: 
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details
  
  - name: Time Range
    id: time_range
    task: set_time_range

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Connect to Earth Ranger
    id: er_client_name
    task: set_er_connection 

  - name: Connect to Earth Engine 
    id: gee_project_name
    task: set_gee_connection 

  - name: Configure grouping strategy 
    id: groupers 
    task: set_groupers 
    partial: 
      groupers: 
        - index_name: subject_name 
  
  - name: Configure basemap layers 
    id: configure_base_maps 
    task: set_base_maps_pydeck
    partial:
      base_maps:
        - url: >-
            https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
          opacity: 1
          max_zoom: 20
  
  - title: Subject Group
    type: task-group
    description: Choose subject group to analyze 
    tasks:
      - name: null
        id: subject_group_var
        task: set_string_var

  - title: Previous Period
    type: task-group
    description: >-
      Define the comparison ("previous") period to contrast against your selected time range.
      Every option below computes a period that ends on the same End Date as your time range, then
      works backward to determine its Start Date. Choose Custom to enter your own Years / Months /
      Weeks / Days offset (defaults to 1 month back), Preset for a common lookback (e.g. 1, 3 or 6
      months, or 1 year back), or Calendar to pick an exact Start Date.
    tasks: 
      # - name: Create date offset 
      #   id: previous_date_offset 
      #   task: create_date_offset 
      #   partial: 
      #     n: 1 
      #     hours: 0
      #     minutes: 0 
      #     seconds: 0

      - name: null
        id: set_previous_period
        task: ecoscope_workflows_ext_ste.tasks.filter.flexible_previous_period
        partial: 
          timerange: ${{ workflow.time_range.return }}
          #offset: ${{ workflow.previous_date_offset.return }}

  - title: Map Overlay
    type: task-group
    description: "Choose the overlay to display on all maps: (a) LandDx — standard protected areas downloaded automatically; (b) EarthRanger Spatial Feature — fetch a named feature set from EarthRanger."
    tasks:
      - name: null
        id: map_overlay
        task: ecoscope_workflows_ext_ste.tasks.landdx.select_map_overlay # allow user to include multiple ER spatial features
        skipif:
          conditions:
            - never
        partial:
          client: ${{ workflow.er_client_name.return }}
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          ldx_url: "https://www.dropbox.com/scl/fi/uitptfgxk4wnfcnv9k96a/mapbook_ldx_layers.gpkg?rlkey=xi2azbfzqix9udytv3smsf6eh&st=249w3d2x&dl=0"

  - name: Choose subject group to analyze 
    id: subject_observations 
    task: get_subjectgroup_observations 
    partial: 
      filter: clean
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      subject_group_name: ${{ workflow.subject_group_var.return }}
      raise_on_empty: false 
      include_details: false 
      include_subjectsource_details: false 

  - name: Convert relocs to timezone
    id: convert_relocs_timezone
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.subject_observations.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - fixtime

  - name: Transform observations to relocations 
    id: subject_reloc
    task: process_relocations 
    partial: 
      observations: ${{ workflow.convert_relocs_timezone.return }}
      relocs_columns: 
        - groupby_col
        - fixtime
        - junk_status 
        - geometry
        - extra__subject__name
        - extra__subject__hex
        - extra__subject__sex
        - extra__created_at
        - extra__subject__subject_subtype

      filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

  - name: Annotate relocations with day/night labels
    id: annotate_day_night 
    task: classify_is_night 
    partial: 
      relocations: ${{ workflow.subject_reloc.return }}

  - title: Trajectory Segment Filter  
    type: task-group
    description: Filter trajectory segments based on criteria like minimum/maximum length, duration and speed. This helps remove GPS noise and unrealistic movements. The same filter will be applied to both current and previous trajectories to ensure consistency in the analysis.
    tasks:
      - name: null
        id: custom_trajs_filter
        task: ecoscope_workflows_ext_ste.tasks.transformation.trajectory_segment_filter
  
  - name: Convert relocations to trajectories 
    id: convert_to_trajectories 
    task: relocations_to_trajectory 
    partial: 
      relocations: ${{ workflow.annotate_day_night.return }}
      trajectory_segment_filter: ${{ workflow.custom_trajs_filter.return }}

  - name: Add temporal index to trajectories 
    id: add_temporal_index_to_traj 
    task: add_temporal_index
    partial: 
      df: ${{ workflow.convert_to_trajectories.return }}
      time_col: segment_start 
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true 
      format: mixed 

  # retrieve previous relocs and trajs based on time range set earlier
  - name: Retrieve previous period observations
    id: previous_observations 
    task: get_subjectgroup_observations 
    partial: 
      filter: clean
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.set_previous_period.return }}
      subject_group_name: ${{ workflow.subject_group_var.return }}
      raise_on_empty: false 
      include_details: false 
      include_subjectsource_details: false
  
  - name: Convert previous relocs to timezone
    id: convert_prev_timezone
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.previous_observations.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - fixtime

  - name: Transform previous observations to relocations 
    id: previous_relocs
    task: process_relocations
    partial: 
      observations: ${{ workflow.convert_prev_timezone.return }}
      relocs_columns: 
        - groupby_col
        - fixtime
        - junk_status 
        - geometry
        - extra__subject__name
        - extra__subject__hex
        - extra__subject__sex
        - extra__created_at
        - extra__subject__subject_subtype

      filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

  - name: Annotate previous relocations with day/night labels
    id: annotate_prev_day_night 
    task: classify_is_night 
    partial: 
      relocations: ${{ workflow.previous_relocs.return }}

  - name: Convert  previous relocations to trajectories 
    id: convert_prev_to_trajectories 
    task: relocations_to_trajectory 
    partial: 
      relocations: ${{ workflow.annotate_prev_day_night.return }}
      trajectory_segment_filter: ${{ workflow.custom_trajs_filter.return }}

  - name: Add temporal index to previous trajectories 
    id: add_temporal_prev_index_to_traj 
    task: add_temporal_index
    partial: 
      df: ${{ workflow.convert_prev_to_trajectories.return }}
      time_col: segment_start 
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true 
      format: mixed 

  - name: Rename trajectory columns for previous period
    id: rename_prev_traj_cols
    task: map_columns
    partial:
      raise_if_not_found: false
      df: ${{ workflow.add_temporal_prev_index_to_traj.return }}
      drop_columns: []
      retain_columns: [] 
      rename_columns: 
        extra__hex: hex_color
        extra__is_night: is_night
        extra__name: subject_name
        extra__sex: subject_sex
        extra__subject_subtype: subject_subtype
        extra__created_at: created_at

  - name: Classify trajectories by speed 
    id: classify_trajectories_speed_bins 
    task: apply_classification 
    partial: 
      df: ${{ workflow.add_temporal_index_to_traj.return }}
      input_column_name: speed_kmhr
      output_column_name: speed_bins
      classification_options: 
        scheme: equal_interval 
        k: 6 
      label_options:
        label_ranges: true
        label_decimals: 1
        label_suffix: ' km/h'
  
  - name: Rename trajectory columns 
    id: rename_traj_cols 
    task: map_columns 
    partial:
      raise_if_not_found: true
      df: ${{ workflow.classify_trajectories_speed_bins.return }}
      drop_columns: []
      retain_columns: [] 
      rename_columns: 
        extra__hex: hex_color
        extra__is_night: is_night
        extra__name: subject_name
        extra__sex: subject_sex
        extra__subject_subtype: subject_subtype
        extra__created_at: created_at

  - name: Persist trajectories as geoparquet
    id: persist_trajs_geoparquet
    task: persist_df
    partial:
      df: ${{ workflow.rename_traj_cols.return }}
      filetype: geoparquet
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: trajectories

  - name: Persist previous period trajectories as geoparquet
    id: persist_prev_trajs_geoparquet
    task: persist_df
    partial:
      df: ${{ workflow.rename_prev_traj_cols.return }}
      filetype: geoparquet
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: previous_period_trajectories

  - name: Persist relocations as geoparquet
    id: persist_relocs_geoparquet
    task: persist_df
    partial:
      df: ${{ workflow.subject_reloc.return }}
      filetype: geoparquet
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: relocations

  - name: Persist previous period relocations as geoparquet
    id: persist_prev_relocs_geoparquet
    task: persist_df
    partial:
      df: ${{ workflow.previous_relocs.return }}
      filetype: geoparquet
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: previous_period_relocations

  - name: Create column for current duration status 
    id: create_current_duration_column 
    task:  ecoscope_workflows_ext_ste.tasks.transformation.add_new_column
    partial:
      df: ${{ workflow.rename_traj_cols.return }}
      column_name: duration_status
      default_value: Current tracks
    
  - name: Create column for previous duration status
    id: create_previous_duration_column 
    task: ecoscope_workflows_ext_ste.tasks.transformation.add_new_column
    partial:
      df: ${{ workflow.rename_prev_traj_cols.return }}
      column_name: duration_status
      default_value: Previous tracks

  - name: Concatenate current and previous trajectories
    id: merge_current_prev_trajs
    task: ecoscope_workflows_ext_ste.tasks.transformation.concatenate_dataframes
    skipif:
      conditions:
        - never
    partial:
      list_df:
        - ${{ workflow.create_current_duration_column.return }}
        - ${{ workflow.create_previous_duration_column.return }}
      
      axis: 0 
      join: outer 
      ignore_index: true 
      keys: null 
      levels: null 
      names: null 
      verify_integrity: false
      sort: true 
      copy: null 

  - name: Add temporal index to combined trajectories
    id: add_temporal_index_to_comb_trajs
    task: add_temporal_index
    partial: 
      df: ${{ workflow.merge_current_prev_trajs.return }}
      time_col: segment_start 
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true 
      format: mixed 
  
  - name: Split trajectories by group 
    id: split_traj_by_group 
    task: split_groups
    partial: 
      df: ${{ workflow.create_current_duration_column.return }}
      groupers: ${{ workflow.groupers.return }}

  - title: Get subject name and use them to persist files with it 
    type: task-group
    description: Choose a grouper to extract subject names for file naming. This will help in organizing the output files based on individual subjects. 
    tasks:
      - name: Get first subject name for filenames
        id: unique_subject_name
        task: column_first_unique_value
        partial:
          column_name: subject_name
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.split_traj_by_group.return }}

      - name: Safe-string subject name for filenames
        id: safe_subject_name
        task: ecoscope_workflows_ext_ste.tasks.transformation.safe_string
        mapvalues:
          argnames: value
          argvalues: ${{ workflow.unique_subject_name.return }}

      - name: Build movement tracks filename 
        id: movement_filename 
        task: prefix_string_var
        partial: 
          var: _movement_tracks.html 
        mapvalues:
          argnames: prefix 
          argvalues: ${{ workflow.safe_subject_name.return }}

      - name: Build speedmap filename 
        id: speedmap_filename 
        task: prefix_string_var
        partial: 
          var: _speedmap.html 
        mapvalues:
          argnames: prefix 
          argvalues: ${{ workflow.safe_subject_name.return }}

      - name: Build day/night filename 
        id: dn_filename 
        task: prefix_string_var
        partial: 
          var: _day_night.html 
        mapvalues:
          argnames: prefix 
          argvalues: ${{ workflow.safe_subject_name.return }}

      - name: Build homerange filename 
        id: hr_filename 
        task: prefix_string_var
        partial: 
          var: _homerange.html 
        mapvalues:
          argnames: prefix 
          argvalues: ${{ workflow.safe_subject_name.return }}

      - name: Build mean speed raster filename 
        id: mr_filename 
        task: prefix_string_var
        partial: 
          var: _mean_speed_raster.html 
        mapvalues:
          argnames: prefix 
          argvalues: ${{ workflow.safe_subject_name.return }}

      - name: Build seasonal homerange filename 
        id: seasonal_hr_filename 
        task: prefix_string_var
        partial: 
          var: _seasonal_homerange.html 
        mapvalues:
          argnames: prefix 
          argvalues: ${{ workflow.safe_subject_name.return }}

      - name: Build ETD filename
        id: etd_filename
        task: prefix_string_var
        partial:
          var: _etd
        mapvalues:
          argnames: prefix 
          argvalues: ${{ workflow.safe_subject_name.return }}

      - name: Build NDVI values filename
        id: ndvi_values_filename
        task: prefix_string_var
        partial:
          var: _ndvi_values
        mapvalues:
          argnames: prefix 
          argvalues: ${{ workflow.safe_subject_name.return }}

      - name: Build MCP filename
        id: mcp_filename
        task: prefix_string_var
        partial:
          var: _mcp
        mapvalues:
          argnames: prefix 
          argvalues: ${{ workflow.safe_subject_name.return }}

      - name: Build seasonal ETD filename
        id: seasonal_etd_filename
        task: prefix_string_var
        partial:
          var: _seasonal_etd
        mapvalues:
          argnames: prefix 
          argvalues: ${{ workflow.safe_subject_name.return }}

      - name: Build mean speed raster filename
        id: mean_speed_raster_filename
        task: prefix_string_var
        partial:
          var: _mean_speed_raster
        mapvalues:
          argnames: prefix 
          argvalues: ${{ workflow.safe_subject_name.return }}

  - name: Split combined trajectories by group
    id: split_comb_trajs 
    task: split_groups
    partial: 
      df: ${{ workflow.add_temporal_index_to_comb_trajs.return }}
      groupers: ${{ workflow.groupers.return }}

  - name: Assign duration status colors 
    id: assign_duration_colors
    task: ecoscope_workflows_ext_ste.tasks.transformation.add_status_color_columns
    partial:
      hex_column: hex_color
      previous_color_hex: "#808080"
      use_hex_column_for_current: true 
      default_current_hex: "#00008b"
      current_status: "Current tracks"
      status_column: "duration_status"
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_comb_trajs.return }}

  # 1. Movement tracks 
  - name: Sort trajectories by duration status 
    id: sort_trajs_by_status
    task: sort_values
    partial: 
      column_name: duration_status
      na_position: first 
      ascending: false
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.assign_duration_colors.return }}

  - name: Exclude unnecessary columns from movement gdf 
    id: filter_movement_cols 
    task: subset_columns 
    partial: 
      columns: 
        - duration_status
        - duration_status_colors
        - is_night
        - geometry
      exclude: null
      strict: false
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.sort_trajs_by_status.return }}

  - name: Create movement track layers
    id: generate_track_layers
    task: ecoscope_workflows_ext_custom.tasks.results.create_path_layer
    partial: 
      data_url: null
      layer_style:
        get_color: duration_status_colors
        get_width: 2.25
        width_scale: 1 
        width_min_pixels: 2 
        width_max_pixels: 8 
        width_units: pixels
        cap_rounded: true 
        joint_rounded: true
        billboard: false
        opacity: 0.45
        stroked: true 
      legend:
        title: Movement Tracks
        label_column: duration_status
        color_column: duration_status_colors
        sort: ascending 
        label_suffix: null
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.filter_movement_cols.return }}

  - name: Combine overlay layers and movement track layers
    id: combined_ldx_movement_layers
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers: ${{ workflow.map_overlay.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.generate_track_layers.return }}

  - title: Map Zoom & Extent
    type: task-group
    description: Calculate the geographic extent of the movement tracks and determine an appropriate zoom level and center point for the map. This ensures that all tracks are visible and well-framed when the map is rendered.
    tasks:
      - name: null
        id: zoom_to_envelope 
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.envelope_gdf
        # partial:
        #   expansion_factor: 1.05
        mapvalues: 
          argnames: gdf 
          argvalues: ${{ workflow.filter_movement_cols.return }}
  
      - name: Zoom view to gdf extent
        id: gdf_image_extent
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
        partial:
          pitch: 0
          bearing: 0
          max_zoom: 15
        mapvalues:
          argnames: gdf
          argvalues: ${{ workflow.zoom_to_envelope.return }}
  
  - name: Combine movement track layers with view state
    id: zip_tracks_with_viewstate
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.combined_ldx_movement_layers.return }}
        - ${{ workflow.gdf_image_extent.return }}

  - name: Draw movement tracks map
    id: draw_movement_tracks
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map 
    partial: 
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null 
      max_zoom: 10
      legend_style: 
        placement: bottom-right
    mapvalues:
      argnames: 
        - geo_layers 
        - view_state
      argvalues: ${{ workflow.zip_tracks_with_viewstate.return }}

  - name: Combine movement track filename with text
    id: movement_tracks_text
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.movement_filename.return }}
        - ${{ workflow.draw_movement_tracks.return }}
  
  - name: Persist movement tracks html
    id: persist_movement_tracks_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: null
    mapvalues:
