# 4. Home Range /MCP 
  - name: Generate etd 
    id: generate_etd 
    task: calculate_elliptical_time_density
    partial: 
      auto_scale_or_custom_cell_size: 
        auto_scale_or_customize: Auto-scale      
      crs: ESRI:53042
      percentiles: 
        - 50.0 
        - 60.0 
        - 70.0
        - 80.0
        - 90.0
        - 95.0
        - 99.9
      nodata_value: nan 
      band_count: 1
      max_speed_factor: 1.05 
      expansion_factor: 1.3
    mapvalues:
      argnames: trajectory_gdf 
      argvalues: ${{ workflow.split_traj_by_group.return }}

  - name: Reproject etd to wgs84 
    id: reproject_etd 
    task: reproject_gdf 
    partial: 
      target_crs: EPSG:4326
    mapvalues: 
      argnames: gdf 
      argvalues: ${{ workflow.generate_etd.return }}

  - name: zip etd filename with df 
    id: etd_df
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.etd_filename.return }}
        - ${{ workflow.reproject_etd.return }}

  - name: Persist etd gdf
    id: persist_etd_gdf
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: geoparquet
    mapvalues:
      argnames: 
        - filename
        - df
      argvalues: ${{ workflow.etd_df.return }}

  - name: Determine seasonal windows 
    id: determine_seasonal_windows 
    task: ecoscope_workflows_ext_ste.tasks.io.compute_seasons_from_ndvi
    partial: 
      client: ${{ workflow.gee_project_name.return }}
      time_range: ${{ workflow.time_range.return }}
      img_collection: "MODIS/061/MCD43A4"
      nir_band: "Nadir_Reflectance_Band2"
      red_band: "Nadir_Reflectance_Band1"
      chunk_count: 5
    mapvalues: 
      argnames: roi 
      argvalues: ${{ workflow.generate_etd.return }}

  - name: Zip seasons with trajectories 
    id: zip_etd_with_traj 
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.determine_seasonal_windows.return }}
        - ${{ workflow.split_traj_by_group.return }}

  - name: Generate season labels 
    id: add_season_labels 
    task: create_seasonal_labels 
    mapvalues: 
      argnames: 
        - seasons_df 
        - trajectories 
      argvalues: ${{ workflow.zip_etd_with_traj.return }}
  
  - name: Generate MCP gdf from trajectories 
    id: generate_mcp 
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_minimum_convex_polygon
    partial: 
      planar_crs: ESRI:53042
    mapvalues: 
      argnames: gdf 
      argvalues: ${{ workflow.split_traj_by_group.return }}

  - name: Reproject mcp gdf to wgs84 
    id: reproject_mcp 
    task: reproject_gdf 
    partial: 
      target_crs: EPSG:4326
    mapvalues: 
      argnames: gdf 
      argvalues: ${{ workflow.generate_mcp.return }}

  - name: Zip mcp filename with gdf 
    id: mcp_gdf 
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.mcp_filename.return }}
        - ${{ workflow.generate_mcp.return }}

  - name: Persist mcp gdf
    id: persist_mcp_gdf
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: geoparquet
    mapvalues:
      argnames: 
        - filename
        - df
      argvalues: ${{ workflow.mcp_gdf.return }}

  - name: Apply colormap to home range percentiles 
    id: apply_etd_colormap 
    task: apply_color_map
    partial: 
      input_column_name: percentile
      output_column_name: etd_percentile_colors
      colormap: RdYlGn
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.reproject_etd.return }}

  - name: Exclude unnecessary columns from etd gdf  
    id: filter_etd_cols 
    task: subset_columns 
    partial: 
      columns: 
        - etd_percentile_colors
        - percentile
        - area_sqkm
        - geometry
      exclude: null
      strict: false
    mapvalues: 
      argnames: df
      argvalues: ${{ workflow.apply_etd_colormap.return }}

  - name: Create home range layers 
    id: generate_home_range_layers 
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial: 
      data_url: null
      layer_style: 
        filled: true 
        stroked: true 
        extruded: false 
        wireframe: false
        get_fill_color: etd_percentile_colors
        get_line_color: etd_percentile_colors
        opacity: 0.45 
        get_line_width: 1.55
        get_elevation: 0
        get_point_radius: 1
        line_width_units: pixels 
        line_width_scale: 1 
        line_width_min_pixels: 1
        line_width_max_pixels: 5

      legend: 
        title: Home Range Percentiles
        label_column: percentile
        color_column: etd_percentile_colors
        sort: ascending 
        label_suffix: null
    mapvalues: 
      argnames: geodataframe
      argvalues: ${{ workflow.filter_etd_cols.return }}

  - name: Exclude unnecessary columns from mcp gdf  
    id: filter_mcp_cols 
    task: subset_columns 
    partial: 
      columns: 
        - area_km2
        - geometry
      exclude: null
      strict: false
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.reproject_mcp.return }}

  - name: Create mcp polygon layer 
    id: create_mcp_polygon_layer 
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer 
    partial: 
      data_url: null
      layer_style: 
        filled: false  
        stroked: true 
        extruded: false 
        wireframe: false
        get_fill_color: [255, 20, 147, 50]
        get_line_color: [255, 20, 147, 200]
        opacity: 0.45
        get_line_width: 2.25
        get_elevation: 0
        get_point_radius: 1
        line_width_units: pixels 
        line_width_scale: 1 
        line_width_min_pixels: 1
        line_width_max_pixels: 5

      legend: 
          title: Minimum Convex Polygon
          values:
            - label: MCP 
              color: "#ff1493"
    mapvalues: 
      argnames: geodataframe
      argvalues: ${{ workflow.filter_mcp_cols.return }}

  - name: Combine home range layer and mcp layer 
    id: zip_home_range_with_mcp_layer
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.create_mcp_polygon_layer.return }}
        - ${{ workflow.generate_home_range_layers.return }}

  - name: Combine overlay layers and home range layers
    id: combined_ldx_home_range_layers
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers: ${{ workflow.map_overlay.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.zip_home_range_with_mcp_layer.return }}

  - name: Combine home range layers with view state
    id: zip_hr_with_viewstate
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.combined_ldx_home_range_layers.return }}
        - ${{ workflow.gdf_image_extent.return }}

  - name: Draw home range map
    id: draw_home_range_map
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map 
    partial: 
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null 
      max_zoom: 10
      legend_style: 
        placement: bottom-right
    mapvalues:
      argnames: 
        - geo_layers 
        - view_state
      argvalues: ${{ workflow.zip_hr_with_viewstate.return }}

  - name: Zip homerange filename with text 
    id: hr_text_file
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.hr_filename.return }}
        - ${{ workflow.draw_home_range_map.return }}

  - name: Persist homerange html
    id: persist_homerange_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: null
    mapvalues:
      argnames: 
        - filename
        - text 
      argvalues: ${{ workflow.hr_text_file.return }}
    
  - name: Create homerange widgets 
    id: create_home_range_widgets 
    task: create_map_widget_single_view 
    skipif:
      conditions:
        - never
    partial: 
      title: Home Range 
    map: 
      argnames: 
        - view 
        - data 
      argvalues: ${{ workflow.persist_homerange_html.return }}

  - name: Merge homerange widgets 
    id: merge_homerange_widgets 
    task: merge_widget_views 
    partial: 
      widgets: ${{ workflow.create_home_range_widgets.return }}

# 5. Mean Speed Raster
  - name: Zip mean speed raster filename with gdf
    id: zip_raster_filename_gdf
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.mean_speed_raster_filename.return }}
        - ${{ workflow.split_traj_by_group.return }}

  - title: Mean Speed Raster
    type: task-group
    description: Configure how the mean speed raster is generated from movement trajectories.
    tasks:
      - name: null
        id: generate_mean_speed_raster
        task: ecoscope_workflows_ext_ste.tasks.results.generate_ecograph_raster
        partial:
          #step_length: 2000
          dist_col: dist_meters
          interpolation: mean
          movement_covariate: speed
          radius: 2
          cutoff: null
          tortuosity_length: 3
          resolution: null
          network_metric: null
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
        mapvalues:
          argnames:
            - filename
            - gdf
          argvalues: ${{ workflow.zip_raster_filename_gdf.return }}

  - name: Extract features from mean speed raster 
    id: extract_speed_rasters 
    task: ecoscope_workflows_ext_ste.tasks.io.raster_to_gdf
    mapvalues: 
      argnames: file_path 
      argvalues: ${{ workflow.generate_mean_speed_raster.return }}

  - name: Sort speed features by value 
    id: sort_speed_features_by_value
    task: sort_values 
    partial: 
      column_name: value
      na_position: last 
      ascending: true 
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.extract_speed_rasters.return }}

  - name: Reproject mean speed raster features to wgs84 
    id: reproject_speed_raster 
    task: reproject_gdf 
    partial: 
      target_crs: EPSG:4326
    mapvalues:
      argnames: gdf 
      argvalues: ${{ workflow.sort_speed_features_by_value.return }}

  - name: Apply classification to speed raster features 
    id: apply_classification_raster 
    task: apply_classification
    partial: 
      input_column_name: value
      output_column_name: value_bins 
      classification_options: 
        scheme: natural_breaks
        k: 6
      label_options:
        label_range: false 
        label_decimals: 1
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.reproject_speed_raster.return }}
    
  - name: Apply colormap to speed raster bins 
    id: apply_speed_raster_colormap 
    task: apply_color_map 
    partial: 
      input_column_name: value_bins
      output_column_name: speedraster_bins_colormap 
      colormap: 
        - '#1a9850'
        - '#91cf60'
        - '#d9ef8b'
        - '#fee08b'
        - '#fc8d59'
        - '#d73027'
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.apply_classification_raster.return }}

  - name: Format speed raster bin labels
    id: format_speed_raster_labels
    task: map_values_with_unit
    partial:
      input_column_name: value_bins
      output_column_name: bins_formatted
      original_unit: km/h
      new_unit: km/h
      decimal_places: 1
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.apply_speed_raster_colormap.return }}

  - name: Exclude unnecessary columns from mean speed raster gdf
    id: filter_mean_speed_cols 
    task: subset_columns 
    partial: 
      columns: 
        - value_bins
        - bins_formatted
        - speedraster_bins_colormap
        - geometry
      exclude: null
      strict: false
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.format_speed_raster_labels.return }}

  - name: Create mean speed raster layer
    id: create_mean_speed_raster_layer 
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer 
    partial: 
      data_url: null
      layer_style: 
        filled: true 
        stroked: false 
        extruded: false 
        wireframe: false
        get_fill_color: speedraster_bins_colormap
        get_line_color: speedraster_bins_colormap
        opacity: 0.45
        get_line_width: 1.55
        get_elevation: 0
        get_point_radius: 1
        line_width_units: pixels 
        line_width_scale: 1 
        line_width_min_pixels: 1
        line_width_max_pixels: 5

      legend: 
        title: Mean Speed Raster (km/h)
        label_column: bins_formatted
        color_column: speedraster_bins_colormap
        sort: ascending 
        label_suffix: null
    mapvalues: 
      argnames: geodataframe
      argvalues: ${{ workflow.filter_mean_speed_cols.return }}

  - name: Combine overlay layers and mean speed raster layer
    id: combined_ldx_speed_raster
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers: ${{ workflow.map_overlay.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.create_mean_speed_raster_layer.return }}

  - name: Combine mean speed raster layer with view state
    id: zip_speed_raster_viewstate
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.combined_ldx_speed_raster.return }}
        - ${{ workflow.gdf_image_extent.return }}

  - name: Draw mean speed raster map
    id: draw_mean_speed_raster_map
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map 
    partial: 
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null 
      max_zoom: 10
      legend_style: 
        placement: bottom-right
    mapvalues:
      argnames: 
        - geo_layers 
        - view_state
      argvalues: ${{ workflow.zip_speed_raster_viewstate.return }}

  - name: Zip mean speed raster filename with text 
