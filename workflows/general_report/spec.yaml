      - name: Draw night threshold map
        id: draw_threshold_map
        task: ecoscope_workflows_ext_custom.tasks.results.draw_map 
        partial: 
          tile_layers: ${{ workflow.configure_base_maps.return }}
          static: false
          title: null 
          widget_id: "Night Fixes"
          max_zoom: 15
          legend_style: 
            placement: bottom-right
          geo_layers: ${{ workflow.combined_ldx_thr_raster.return }}
          view_state: ${{ workflow.gdf_image_extent.return }}

      - name: Persist night threshold html
        id: persist_threshold_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: null
          filename: "night_fixes.html"
          text: ${{ workflow.draw_threshold_map.return }}

      - name: Create Night Fixes widget
        id: widget_threshold_map
        task: create_map_widget_single_view
        skipif:
