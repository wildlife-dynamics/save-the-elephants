    id: apply_etd_colormap 
    task: apply_color_map
    partial: 
      input_column_name: percentile
      output_column_name: etd_percentile_colors
      colormap: RdYlGn
      df: ${{ workflow.reproject_etd.return }}

  - name: Exclude unnecessary columns from etd gdf  
    id: filter_etd_cols 
    task: subset_columns 
    partial: 
      columns: 
        - etd_percentile_colors
        - percentile
        - area_sqkm
        - geometry
      exclude: null
      strict: false
      df: ${{ workflow.apply_etd_colormap.return }}

  - name: Create home range layers 
    id: generate_home_range_layers 
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial: 
      data_url: null
      layer_style: 
        filled: true 
        stroked: true 
        extruded: false 
        wireframe: false
        get_fill_color: etd_percentile_colors
        get_line_color: etd_percentile_colors
        opacity: 0.45 
        get_line_width: 1.55
        get_elevation: 0
