    id: persist_speedmap_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: null
      text: ${{ workflow.draw_speedmap.return }}
      filename: "subject_tracks.html"
  
  # 4 Home range map 
  - name: Generate ETD for all subjects
    id: generate_etd 
    task: calculate_elliptical_time_density
    partial: 
      auto_scale_or_custom_cell_size: 
        auto_scale_or_customize: Auto-scale      
      crs: ESRI:53042
      percentiles: 
        - 50.0 
        - 60.0 
        - 70.0
        - 80.0
        - 90.0
        - 95.0
        - 99.9
      nodata_value: nan 
      band_count: 1
      max_speed_factor: 1.05 
      expansion_factor: 1.3
      trajectory_gdf: ${{ workflow.rename_traj_cols.return }}

  - name: Reproject etd to wgs84 
    id: reproject_etd 
    task: reproject_gdf 
    partial: 
      target_crs: EPSG:4326
      gdf: ${{ workflow.generate_etd.return }}

  - name: Persist etd gdf
    id: persist_etd_gdf
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: geoparquet
      filename: homerange_etd
      df: ${{ workflow.reproject_etd.return }}

  - name: Determine seasonal windows 
    id: determine_seasonal_windows 
    task: ecoscope_workflows_ext_ste.tasks.io.compute_seasons_from_ndvi
    partial: 
      client: ${{ workflow.gee_project_name.return }}
      time_range: ${{ workflow.time_range.return }}
      img_collection: "MODIS/061/MCD43A4"
      nir_band: "Nadir_Reflectance_Band2"
      red_band: "Nadir_Reflectance_Band1"
      chunk_count: 5
      roi: ${{ workflow.generate_etd.return }}

  - name: Generate season labels 
    id: add_season_labels 
    task: create_seasonal_labels 
    partial: 
      season_df: ${{ workflow.determine_seasonal_windows.return }}
      trajectories: ${{ workflow.rename_traj_cols.return }}

  - name: Apply colormap to home range percentiles 
    id: apply_etd_colormap 
    task: apply_color_map
    partial: 
      input_column_name: percentile
      output_column_name: etd_percentile_colors
      colormap: RdYlGn
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.reproject_etd.return }}

  - name: Exclude unnecessary columns from etd gdf  
    id: filter_etd_cols 
    task: subset_columns 
    partial: 
      columns: 
        - etd_percentile_colors
        - percentile
        - area_sqkm
        - geometry
      exclude: null
      strict: false
    mapvalues: 
      argnames: df
      argvalues: ${{ workflow.apply_etd_colormap.return }}

  - name: Create home range layers 
    id: generate_home_range_layers 
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial: 
      data_url: null
      layer_style: 
        filled: true 
        stroked: true 
        extruded: false 
        wireframe: false
        get_fill_color: etd_percentile_colors
        get_line_color: etd_percentile_colors
        opacity: 0.45 
        get_line_width: 1.55
        get_elevation: 0
        get_point_radius: 1
        line_width_units: pixels 
        line_width_scale: 1 
        line_width_min_pixels: 1
        line_width_max_pixels: 5

      legend: 
        title: Home Range Percentiles
        label_column: percentile
        color_column: etd_percentile_colors
