  #15 Seasonal HR maps 
  - name: Split trajectories by group
    id: split_traj_by_group 
    task: split_groups 
    partial: 
      df: ${{ workflow.add_season_labels.return }}
      groupers: ${{ workflow.groupers.return }}

  - name: Get first subject name for filenames
    id: unique_subject_name
    task: column_first_unique_value
    partial:
      column_name: subject_name
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_traj_by_group.return }}

  - name: Safe-string subject name for filenames
    id: safe_subject_name
    task: ecoscope_workflows_ext_ste.tasks.transformation.safe_string
    mapvalues:
      argnames: value
      argvalues: ${{ workflow.unique_subject_name.return }}

  - name: Build seasonal ETD filename
    id: seasonal_etd_filename
    task: prefix_string_var
    partial:
      var: _seasonal_etd
    mapvalues:
      argnames: prefix 
      argvalues: ${{ workflow.safe_subject_name.return }}
          
  - name: Calculate seasonal home range 
    id: seasonal_home_range 
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.calculate_elliptical_time_density_grouped
    partial:
      groupby_cols: 
        - season 
      percentiles: 
      - 99.9 
      cell_size: 
        auto_scale_or_custom: Auto-scale #Customize 
      drop_null_groups: true
    mapvalues:
      argnames: gdf
      argvalues: ${{ workflow.split_traj_by_group.return }}

  - name: Convert season column to string 
    id: convert_season_to_string 
    task: convert_columns_to_string
    partial: 
      columns: 
        - season 
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.seasonal_home_range.return }}

  - name: Zip seasonal etd filename with gdf
    id: seasonal_etd_gdf
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.seasonal_etd_filename.return }}
        - ${{ workflow.convert_season_to_string.return }}

  - name: Persist seasonal etd gdf
    id: persist_seasonal_etd_gdf
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: geoparquet
    mapvalues:
      argnames: 
        - filename
        - df
      argvalues: ${{ workflow.seasonal_etd_gdf.return }}

  - name: Reproject seasonal home range gdf to wgs84 
    id: reproject_seasonal_home_range 
    task: reproject_gdf 
    partial: 
      target_crs: EPSG:4326
    mapvalues: 
      argnames: gdf 
      argvalues: ${{ workflow.convert_season_to_string.return }}

  - name: Sort seasonal homerange by seasons
    id: sort_seasons
    task: sort_values 
    partial:
      column_name: season
      na_position: first 
      ascending: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.reproject_seasonal_home_range.return }}

  - name: Map column values to assign colors to seasons 
    id: assign_season_colors 
    task: add_mapped_column_value 
    partial: 
      column: season 
      new_column: season_hex 
      default: null 
      keep_unmapped: false 
      mapping: {
        "Dry" : "#f57c00",
        "Wet" : "#255084" 
      }
    mapvalues: 
      argnames: df 
      argvalues: ${{ workflow.sort_seasons.return }}
  
  - name: Apply seasonal hex to rgba 
    id: seasonal_hex_rgba
    task: add_rgba_from_hex 
    partial: 
      column: season_hex 
      new_column: season_colors 
    mapvalues: 
      argnames: df 
      argvalues: ${{ workflow.assign_season_colors.return }}

  - name: Exclude unnecessary columns from seasonal homerange 
    id: filter_season_cols 
    task: subset_columns 
    partial: 
      columns: 
        - season_colors
        - season
        - geometry
      exclude: null
      strict: false
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.seasonal_hex_rgba.return }}

  - name: Create seasonal home range layers
    id: generate_season_layers 
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial: 
      data_url: null
      layer_style: 
        filled: true 
        stroked: true 
        extruded: false 
        wireframe: false
        get_fill_color: season_colors
        get_line_color: season_colors
        opacity: 0.45
        get_line_width: 0.35
        get_elevation: 0
        get_point_radius: 1
        line_width_units: pixels 
        line_width_scale: 1 
        line_width_min_pixels: 1
        line_width_max_pixels: 5

      legend: 
          title: Seasonal Home Range
          label_column: season
          color_column: season_colors
          sort: ascending 
          label_suffix: null
    mapvalues: 
      argnames: geodataframe
      argvalues: ${{ workflow.filter_season_cols.return }}

  - name: Combine overlay layers and seasonal home range layers
    id: combined_ldx_seasonal_hr_layers
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers: ${{ workflow.map_overlay.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.generate_season_layers.return }}

  - name: Zoom value to individual seasonal home range
    id: zoom_to_season_envelope 
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.envelope_gdf
    partial:
      expansion_factor: 1.1
    mapvalues: 
      argnames: gdf 
      argvalues: ${{ workflow.split_traj_by_group.return }}

  - name: Zoom view to season gdf extent
    id: season_gdf_image_extent
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
    partial:
      pitch: 0
      bearing: 0
      max_zoom: 15
    mapvalues:
      argnames: gdf
      argvalues: ${{ workflow.zoom_to_season_envelope.return }}

  - name: Combine seasonal home range layers with view state
    id: zip_seasonal_hr_with_viewstate
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.combined_ldx_seasonal_hr_layers.return }}
        - ${{ workflow.season_gdf_image_extent.return }}

  - name: Draw seasonal home range map
    id: draw_seasonal_home_range_map
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map 
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null 
      max_zoom: 15
      legend_style: 
        placement: bottom-right
    mapvalues:
      argnames: 
        - geo_layers 
        - view_state
      argvalues: ${{ workflow.zip_seasonal_hr_with_viewstate.return }}

  - name: Build seasonal homerange filename 
    id: seasonal_hr_filename 
    task: prefix_string_var
    partial: 
      var: _seasonal_homerange.html 
    mapvalues:
      argnames: prefix 
      argvalues: ${{ workflow.safe_subject_name.return }}

  - name: Zip seasonal homerange filename with text 
    id: seasonal_hr_text 
    skipif:
      conditions:
        - any_keyed_iterables_are_skips
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.seasonal_hr_filename.return }}
        -  ${{ workflow.draw_seasonal_home_range_map.return }}

  - name: Persist seasonal home range html
    id: persist_seasonal_home_range_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: null
    mapvalues:
      argnames: 
        - filename
        - text 
      argvalues: ${{ workflow.seasonal_hr_text.return }}

