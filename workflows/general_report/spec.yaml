      - name: Generate Recursion Raster
        id: generate_weight_raster
        task: ecoscope_workflows_ext_ste.tasks.results.generate_ecograph_raster
        partial:
          step_length: ${{ workflow.set_grid_value.return }}
          dist_col: dist_meters
          interpolation: mean
          movement_covariate: null
          radius: 2
          cutoff: null
          tortuosity_length: 3
          resolution: null
          network_metric: weight
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename: "weighted_raster"
