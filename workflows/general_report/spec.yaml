        id: subject_feature_density 
        task: calculate_feature_density
        partial: 
          geodataframe: ${{ workflow.reproject_relocs.return }}
          meshgrid: ${{ workflow.generate_meshgrid.return }}
          geometry_type: point 
          sum_column: null 

      - name: Exclude cells that dont have any density values 
        id: exclude_null_cells 
        task: ecoscope_workflows_ext_ste.tasks.filter.filter_rows
        partial: 
          df: ${{ workflow.subject_feature_density.return }}
          column_name: density 
          op: gt 
          value: 0 
          reset_index: true 

      - name: Perform a spatial join between the generated meshgrid and the relocs
        id: relocs_mesh_join
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.spatial_join 
        partial: 
          left_df: ${{ workflow.exclude_null_cells.return }}
          right_df : ${{ workflow.reproject_relocs.return }}
          how: "inner"
          predicate: "intersects"

      - name: Generate day-night time dominance 
        id: day_night_dominance
        task: aggregate_day_night_fixes 
        partial: 
          gdf: ${{ workflow.relocs_mesh_join.return }}

      - name: Reproject day night time dominance to EPSG:4326
        id: reproject_day_night 
        task: reproject_gdf 
        partial:  
          gdf: ${{ workflow.day_night_dominance.return }}
          target_crs: EPSG:4326

      - name: Add mapped color column for day night 
        id: day_night_mapped_col
        task: add_mapped_column_value 
        partial:
          column: dominant
          new_column: dominance_hex 
          default: null 
          keep_unmapped: false 
          mapping: {
            "Day": "#6495ed",
            "Night": "#00008b"
          }
          df: ${{ workflow.reproject_day_night.return }}

      - name: Apply dominance hex to rgba
        id: dominance_hex_rgba 
        task: add_rgba_from_hex
        partial: 
          column: dominance_hex 
          new_column: dominance_colors 
          df: ${{ workflow.day_night_mapped_col.return }}

      - name: Create day night dominance  raster layer
        id: dn_layer 
        task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer 
        partial: 
          data_url: null
          layer_style: 
            filled: true 
            stroked: false 
            extruded: false 
            wireframe: false
            get_fill_color: dominance_colors
            get_line_color: dominance_colors
            opacity: 0.45
            get_line_width: 1.55
            get_elevation: 0
            get_point_radius: 1
            line_width_units: pixels 
            line_width_scale: 1 
            line_width_min_pixels: 1
            line_width_max_pixels: 5

          legend: 
            title: Time of day dominance
            label_column: dominant
            color_column: dominance_colors
            sort: ascending 
            label_suffix: null
          geodataframe: ${{ workflow.dominance_hex_rgba.return }}

      - name: Combine overlay layers and day night layers
        id: combined_ldx_dn_raster
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
        partial:
          static_layers: ${{ workflow.map_overlay.return }}
          grouped_layers: ${{ workflow.dn_layer.return }}

      - name: Draw day-night dominance map
        id: draw_dn_map
        task: ecoscope_workflows_ext_custom.tasks.results.draw_map 
        partial: 
          tile_layers: ${{ workflow.configure_base_maps.return }}
          static: false
          title: null 
          widget_id: "Day-Night Dominance"
          max_zoom: 15
          legend_style: 
            placement: bottom-right
          geo_layers: ${{ workflow.combined_ldx_dn_raster.return }}
          view_state: ${{ workflow.gdf_image_extent.return }}

      - name: Persist day night html
        id: persist_dn_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: null
          filename: "time_of_day_dominance.html"
          text: ${{ workflow.draw_dn_map.return }}

      - name: Create Day-Night Dominance widget
        id: widget_dn_map
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Day-Night Dominance"
          data: ${{ workflow.persist_dn_html.return }}

    # 10 Night time fixes 
      - name: Exclude day fixes
        id: exclude_day_fixes
        task: ecoscope_workflows_ext_ste.tasks.filter.filter_rows
        partial: 
