  # Download Logo
  - title: Report logo
    type: task-group
    description: Optional. Download or fetch the logo to be used in the report cover page. Leave blank to omit a logo from the cover page.
    tasks:
      - name: null
        id: logo_path
        task: get_file_path 
        partial: 
          output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

  - name: Unique subjects on relocs
    id: unique_subjects
    task: dataframe_column_nunique
    partial:
      df: ${{ workflow.rename_traj_cols.return }}
      column_name: subject_name

  - name: Create cover page context 
    id: cover_page_context 
    task: ecoscope_workflows_ext_ste.tasks.reporting.prepare_cover_metadata 
    partial: 
      org_logo_path: ${{ workflow.logo_path.return }}
      report_period: ${{ workflow.time_range.return }}
      prepared_by: "Ecoscope"
      extra_fields:
        count: ${{ workflow.unique_subjects.return }}
      time_generated_format: "%Y-%m-%d %H:%M:%S"

  - name: Persist cover page 
    id: persist_cover_context
    task: ecoscope_workflows_ext_ste.tasks.reporting.create_context_page
    partial:
      template_path: ${{ workflow.download_cover_page.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      context: ${{ workflow.cover_page_context.return }}
      filename: general_cover_page.docx 

  - name: Create general template context 
    id: generate_template_report
    task: ecoscope_workflows_ext_ste.tasks.reporting.general_template_context 
    partial: 
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      template_path: ${{ workflow.download_general_template.return }}
      filename: null
      width: 5.34 
      height: 3.12 

  - name: Merge cover page and general documents 
    id: merge_mapbook_docs
    skipif:
      conditions:
        - any_dependency_skipped
      unpack_depth: 1
    task: ecoscope_workflows_ext_ste.tasks.reporting.merge_docx_documents
    partial:
      cover_page_path: ${{ workflow.persist_cover_context.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      order_by: name
      filename: overall_report.docx
      context_page_items: 
        - ${{ workflow.generate_template_report.return }}

  - name: General Report Dashboard
    id: general_dashboard 
    task: gather_dashboard 
    partial: 
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.widget_movement_tracks.return }}
        - ${{ workflow.widget_collar_events.return }}
        - ${{ workflow.widget_speedmap.return }}
        - ${{ workflow.widget_home_range_map.return }}
        - ${{ workflow.widget_filtered_hr_map.return }}
        - ${{ workflow.widget_weight_raster_map.return }}
        - ${{ workflow.widget_wet_map.return }}
        - ${{ workflow.widget_dry_map.return }}
        - ${{ workflow.widget_dn_map.return }}
        - ${{ workflow.widget_threshold_map.return }}
        - ${{ workflow.widget_protected_map.return }}
        - ${{ workflow.widget_unprotected_map.return }}
      time_range: ${{ workflow.time_range.return }}
      groupers: null #${{ workflow.groupers.return }}